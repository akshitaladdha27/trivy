name: Security and Test Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Sahi jagah permissions ki: Root level par
permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Trivy Scan Step
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'your-image-name:latest' # Apni image ka naam yahan likho
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '0'

      # 2. Allure Report Generation (Assuming Node.js/MERN stack)
      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test # Allure results folder banna chahiye yahan

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      # 3. Deploy to GH Pages (For Allure Link)
      - name: Deploy Report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      # 4. PR Comment (Image jaisa result dikhane ke liye)
      - name: Post Comment on PR
        uses: thollander/actions-comment-pull-request@v2
        if: github.event_name == 'pull_request'
        with:
          message: |
            ## 🚀 Scan & Test Report
            
            ### 🛡️ Trivy Security Scan
            Check the logs for full vulnerability details.
            
            ### 📊 Allure Test Results
            ✅ Report has been generated!
            🔗 [View Full Interactive Report Here](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)