name: Trivy Docker Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy & Plugins
        run: |
          
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          
          
          trivy plugin install https://github.com/aquasecurity/trivy-plugin-referrer.git
          trivy plugin install https://github.com/aquasecurity/trivy-plugin-referrer/releases/download/v0.3.1/trivy_plugin_referrer_0.3.1_macOS-ARM64.tar.gz
          trivy plugin install https://github.com/aquasecurity/trivy-plugin-scan2html.git
          
          # Generate the HTML report from the filesystem
          trivy scan2html fs --scanners vuln,secret,misconfig . interactive_report.html

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t myapp:latest .
        
      - name: Run Trivy Image Scan (JUnit)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'myapp:latest'
          format: 'template'
          template: '@/contrib/junit.tpl'
          output: 'trivy-junit.xml'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-interactive-report
          path: interactive_report.html