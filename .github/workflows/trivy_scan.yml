name: Trivy Docker Scan

on:
  push:
    branches: 
    - "main"
    
  pull_request:
    branches: 
    - "main"

  permissions:
    contents: write
    pull-requests: write
    checks: write

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t myapp:latest .
        
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'myapp:latest'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH, CRITICAL'
          output: 'trivy-results.txt'

      - name: Post Trivy result to PR
        uses: mshick/add-pr-comment@v2
        if: github.event_name == 'pull_request'
        with:
          message: |
            ## 🛡️ Trivy Scan Results
            ```
            $(cat trivy-results.txt)
            ```

      - name: Get Allure history
        uses: actions/checkout@v3
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Allure Report Action
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: Deploy Allure report to Github Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

     
      - name: Post Allure Link to PR
        uses: thollander/actions-comment-pull-request@v2
        if: always()
        with:
          message: |
            ## 📊 Test Report Published
            ✅ View full Allure Report here: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/