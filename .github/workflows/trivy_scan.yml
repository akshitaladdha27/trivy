name: Trivy Security Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Install Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install wget jq -y
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.50.2_Linux-64bit.deb
          sudo dpkg -i trivy_0.50.2_Linux-64bit.deb

      # Run Filesystem Scan
      - name: Run Trivy Scan (JSON)
        run: |
          trivy fs --format json -o trivy-results.json .

      # Generate Beautiful Summary
      - name: Generate Security Summary
        run: |
          CRITICAL=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json)
          HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")] | length')
          MEDIUM=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length')
          LOW=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="LOW")] | length')

          echo "## 🔐 Trivy Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 Low | $LOW |" >> $GITHUB_STEP_SUMMARY

          TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW))
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧮 Total Vulnerabilities: $TOTAL" >> $GITHUB_STEP_SUMMARY

      # Fail if High or Critical found
      - name: Enforce Security Policy
        run: |
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "❌ High or Critical vulnerabilities detected!"
            exit 1
          else
            echo "✅ No blocking vulnerabilities found."
          fi