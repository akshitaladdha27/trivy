name: Trivy Docker Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t myapp:latest .

      - name: Generate Job Summary & HTML Report
        run: |
          # 1. Trivy binary install karein
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          
          # 3. Interactive HTML file banane ke liye (Bina plugin ke remote template use karein)
          trivy image --format template \
            --template "@https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl" \
            --output interactive_report.html myapp:latest

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-interactive-report
          path: interactive_report.html