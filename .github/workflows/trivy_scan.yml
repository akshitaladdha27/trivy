name: Trivy Docker Scan

on:
  push:
    branches: 
      - "main"
  pull_request:
    branches: 
      - "main"

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated to v4

      - name: Set up Python
        uses: actions/setup-python@v5 # Updated to v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install flask pytest allure-pytest

      - name: Run Python Tests
        run: pytest --junitxml=junit-results.xml
        continue-on-error: true 
      
      - name: Install Trivy & Plugins
        run: |
          # Fast install via script
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy plugin install github.com/aquasecurity/trivy-plugin-scan2html
          trivy scan2html fs --scanners vuln,secret,misconfig . interactive_report.html

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t myapp:latest .
        
      - name: Run Trivy Image Scan (JUnit)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'myapp:latest'
          format: 'template'
          template: '@/contrib/junit.tpl'
          output: 'trivy-junit.xml'
          severity: 'HIGH,CRITICAL' # No spaces between severities

      - name: Publish Trivy JUnit Report
        uses: turing85/publish-report@v2
        if: always()
        with:
          report-name: 'Trivy Security Scan'
          report-path: 'trivy-junit.xml' 
          report-reporter: 'java-junit'

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-interactive-report
          path: interactive_report.html