name: Trivy Docker Scan

on:
  push:
    branches: 
      - "main"
  pull_request:
    branches: 
      - "main"


permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pytest allure-pytest

      - name: Run Python Tests
        run: pytest --junitxml=junit-results.xml
        continue-on-error: true # Taaki fail hone par bhi report dikhe

      - name: set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t myapp:latest .
        
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'myapp:latest'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH, CRITICAL'

      - name: Publish Report
        uses: turing85/publish-report@v2
        if: always()
        with:
          comment-header: my-comment-header
          comment-message-success: |
            YAY! {0} passed!  
            
            {1} tests were successful, {2} tests failed, {3} test were skipped.
            
            The report can be found [here]({4}).

          comment-message-failure: |
            On no! {0} failed!  

            {1} tests were successful, {2} tests failed, {3} test were skipped.

            The report can be found [here]({4}).
          report-fail-on-error: true 
          report-name: Tests
          report-path: 'junit-results.xml'
          report-reporter: junit

      