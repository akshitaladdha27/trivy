name: Trivy Docker Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t myapp:latest .

      - name: Generate Interactive HTML Report
        run: |
          # 1. Trivy install karein
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          
          # 2. Direct remote template URL use karein
          # Isse 'no such file or directory' wala error nahi aayega
          trivy fs --format template \
            --template "@https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl" \
            -o interactive_report.html .
        
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'myapp:latest'
          format: 'template'
          template: '@/contrib/junit.tpl'
          output: 'interactive_report.html'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-interactive-report
          path: interactive_report.html