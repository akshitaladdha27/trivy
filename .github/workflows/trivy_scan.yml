name: Trivy Docker Scan & Reporting

on:
  push:
    branches: ["main", "issue-*"]
  pull_request:
    branches: ["main", "issue-*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t myapp:${{ github.sha }} .
        
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'myapp:${{ github.sha }}'
          format: 'table'
          exit-code: '0' # Set to 1 if you want to break the build on vulnerabilities
          severity: 'HIGH, CRITICAL'

      # Note: If you want to deploy a Trivy HTML report, 
      # you must change the format to 'template' and specify an output file.

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: '**/surefire-reports/TEST-*.xml'
          reporter: java-junit

      
      - name: Run Trivy Scan (JSON for PR)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'myapp:${{ github.sha }}'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'HIGH, CRITICAL'

    
      - name: Publish Trivy Report
        uses: turing85/publish-report@v2
        if: always()
        with:
          checkout: false
          report-name: 'Trivy Security Scan'
          report-path: 'trivy-results.json'
          display-type: 'compact' 

      - name: Publish JUnit Report
        uses: turing85/publish-report@v2
        if: always()
        with:
          checkout: false
          report-name: 'JUnit Tests'
          report-path: '**/surefire-reports/TEST-*.xml'
          display-type: 'compact'