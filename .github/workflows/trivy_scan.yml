name: Trivy Docker Scan

on:
  push:
    branches: 
      - "main"
  pull_request:
    branches: 
      - "main"

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install Trivy & Plugins
        run: |
          # Install Trivy
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          
          # Install plugins using the full HTTPS URL to avoid git prompt issues
          trivy plugin install https://github.com/aquasecurity/trivy-plugin-common.git
          trivy plugin install https://github.com/aquasecurity/trivy-plugin-scan2html.git
          
          # Run the scan
          trivy scan2html fs --scanners vuln,secret,misconfig . interactive_report.html
      
      - name: set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t myapp:latest .
        
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'myapp:latest'
          format: 'template'
          template: '@/contrib/junit.tpl'
          output: 'trivy-junit.xml'
          exit-code: '1'
          severity: 'HIGH, CRITICAL'

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-interactive-report
          path: interactive_report.html

     
      