name: Trivy Docker Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t myapp:latest .

      - name: Install Trivy and Generate Interactive Report
        run: |
          # 1. Trivy install karein
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          
          # 2. scan2html plugin install karein (Direct URL use karein taaki credential error na aaye)
          trivy plugin install https://github.com/aquasecurity/trivy-plugin-scan2html.git
          
          # 3. Scan run karein aur interactive_report.html generate karein
          # Isse wahi dashboard banega jo aapne screenshot mein dekha hai
          trivy scan2html fs --scanners vuln,secret,misconfig . interactive_report.html
        
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'myapp:latest'
          format: 'template'
          template: '@/contrib/junit.tpl'
          output: 'trivy-junit.xml'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-interactive-report
          path: interactive_report.html