name: Trivy Docker Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: read

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov allure-pytest

      - name: Run Python Tests
        run: |
          # Agar aapka test kisi specific folder mein hai toh 'pytest folder_name/' likhein
          pytest --junitxml=results.xml || true 
        continue-on-error: true

      

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'myapp:latest' 
          scan-type: 'fs' 
          format: 'table'
          exit-code: '0'

      
      - name: Publish JUnit Report
        uses: turing85/publish-report@v2
        if: always() # Taaki tests fail hone par bhi table dikhe
        with:
          checkout: false
          report-name: 'Python Test Results'
          report-path: 'results.xml'