name: Trivy Docker Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  Trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t myapp:latest .

      - name: Checkmarx AST Github Action
        uses: checkmarx/ast-github-action@v2.0.44
        with:
          base_uri: ${{ secrets.AST_RND_SCANS_BASE_URI }}
          cx_tenant: ${{ secrets.AST_RND_SCANS_TENANT }}
          cx_client_id: ${{ secrets.AST_RND_SCANS_CLIENT_ID }}
          cx_client_secret: ${{ secrets.AST_RND_SCANS_CLIENT_SECRET }}
          additional_params: >
            --tags AceOfSpades
            --project-groups sast-and-engines/sast/languages-and-frameworks/aceofspades
            --threshold "sast-critical=1; sast-high=1; sast-medium=1; sast-low=1;
            sca-critical=1; sca-high=1; sca-medium=1; sca-low=1;
            iac-security-critical=1; iac-security-high=1;
            iac-security-medium=1; iac-security-low=1"

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'myapp:latest'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
