name: Trivy Docker Scan

on:
  push:
    branches: 
      - "main"
  pull_request:
    branches: 
      - "main"

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install flask pytest allure-pytest

      - name: Install dependencies
        run: pip install pytest allure-pytest

      - name: Run Python Tests
        run: pytest --junitxml=junit-results.xml
        continue-on-error: true 
      
      - name: Install Trivy
        run: |
          brew install aquasecurity/trivy/trivy

      - name: Install & Run scan2html
        run: |
          trivy plugin install github.com/aquasecurity/trivy-plugin-common
          trivy plugin install github.com/aquasecurity/trivy-plugin-scan2html
          trivy scan2html fs --scanners vuln,secret,misconfig . interactive_report.html

      - name: set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t myapp:latest .
        
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'myapp:latest'
          format: 'template'
          template: '@/contrib/junit.tpl'
          output: 'trivy-junit.xml'
          exit-code: '1'
          severity: 'HIGH, CRITICAL'

      - name: Publish Trivy JUnit Report
        uses: turing85/publish-report@v2
        if: always()
        with:
          report-name: 'Trivy Security Scan'
          report-path: 'trivy-junit.xml' 
          report-reporter: 'java-junit'

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-interactive-report
          path: interactive_report.html

      # - name: Check for Critical CVEs and Fail
      #   uses: aquasecurity/trivy-action@0.24.0
